<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWrt 网络管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
    <!-- 头部导航 -->
    <header class="header">
        <div class="header-content">
            <h1 class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 2a10 10 0 0 1 0 20"/>
                    <path d="M2 12h20"/>
                </svg>
                OpenWrt 网络管理系统
            </h1>
            <nav class="nav-tabs">
                <button class="nav-tab active" data-tab="traffic">
                    📊 流量监控
                </button>
                <button class="nav-tab" data-tab="firewall">
                    🛡️ 防火墙配置
                </button>
            </nav>
            <div class="status-indicator" id="statusIndicator">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">检测中...</span>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- ==================== 流量监控面板 ==================== -->
        <section class="panel active" id="trafficPanel">
            <!-- 统计卡片 -->
            <div class="stats-row" id="statsRow">
                <div class="stat-card">
                    <div class="stat-card-icon">🔗</div>
                    <div class="stat-card-body">
                        <div class="stat-card-label">活跃流数</div>
                        <div class="stat-card-value" id="statActiveFlows">0</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-icon">📥</div>
                    <div class="stat-card-body">
                        <div class="stat-card-label">总流量</div>
                        <div class="stat-card-value" id="statTotalBytes">0 B</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-icon">⚡</div>
                    <div class="stat-card-body">
                        <div class="stat-card-label">峰值速率</div>
                        <div class="stat-card-value" id="statPeakRate">0 bps</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-icon">📊</div>
                    <div class="stat-card-body">
                        <div class="stat-card-label">总数据包</div>
                        <div class="stat-card-value" id="statTotalPkts">0</div>
                    </div>
                </div>
            </div>

            <!-- 单流量折线图 -->
            <div class="chart-container">
                <div class="chart-header">
                    <h3>实时流量速率</h3>
                    <div class="chart-select-bar">
                        <span class="chart-select-label">显示曲线：</span>
                        <select id="flowSelect" class="chart-select">
                            <option value="all">全部</option>
                        </select>
                    </div>
                </div>
                <div id="flowChart" style="height: 320px;"></div>
            </div>

            <!-- 流量详情表格 -->
            <div class="table-container">
                <div class="table-header">
                    <h3>流量详情</h3>
                    <span class="table-subtitle" id="tableUpdateTime">--</span>
                </div>
                <!-- 筛选栏 -->
                <div class="filter-bar" id="filterBar">
                    <div class="filter-item">
                        <label class="filter-label">源 IP</label>
                        <input type="text" id="filterSrcIp" class="filter-input" placeholder="如 192.168.1.1">
                    </div>
                    <div class="filter-item">
                        <label class="filter-label">目的 IP</label>
                        <input type="text" id="filterDstIp" class="filter-input" placeholder="如 10.0.0.1">
                    </div>
                    <div class="filter-item">
                        <label class="filter-label">端口</label>
                        <input type="text" id="filterPort" class="filter-input" placeholder="源或目的端口">
                    </div>
                    <div class="filter-item">
                        <label class="filter-label">协议</label>
                        <select id="filterProtocol" class="filter-select">
                            <option value="">全部</option>
                            <option value="TCP">TCP</option>
                            <option value="UDP">UDP</option>
                            <option value="ICMP">ICMP</option>
                            <option value="OTHER">OTHER</option>
                        </select>
                    </div>
                    <button type="button" class="btn-filter-clear" id="btnFilterClear" title="清除筛选">✕ 清除</button>
                    <span class="filter-count" id="filterCount"></span>
                </div>
                <div class="table-wrapper">
                    <table class="data-table" id="trafficTable">
                        <thead>
                            <tr>
                                <th>源 IP</th>
                                <th>目的 IP</th>
                                <th>协议</th>
                                <th>端口</th>
                                <th>当前速率</th>
                                <th>峰值速率</th>
                                <th>2s 均值</th>
                                <th>10s 均值</th>
                                <th>40s 均值</th>
                                <th>累计流量</th>
                                <th>数据包数</th>
                            </tr>
                        </thead>
                        <tbody id="trafficTableBody">
                            <tr>
                                <td colspan="11" class="empty-state">
                                    等待流量数据... 请确保流量监控程序正在运行
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="table-more-row" style="display:none;">
                    <button type="button" class="btn btn-sm table-more-btn" id="trafficTableMore">显示更多</button>
                </div>
            </div>
        </section>

        <!-- ==================== 防火墙配置面板 ==================== -->
        <section class="panel" id="firewallPanel">
            <div class="firewall-vertical">

                <!-- 规则列表（上方） -->
                <div class="card" style="margin-bottom:24px;">
                    <div class="card-header">
                        <h3>当前防火墙规则 (FORWARD 链)</h3>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <button class="btn btn-sm" id="btnRefreshRules">🔄 刷新</button>
                            <button class="btn btn-danger btn-sm" id="btnClearRules">🗑️ 清空规则</button>
                        </div>
                    </div>
                    <div class="card-body" style="padding:0;">
                        <div class="table-wrapper">
                            <table class="data-table" id="firewallTable">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>数据包</th>
                                        <th>字节</th>
                                        <th>目标</th>
                                        <th>协议</th>
                                        <th>源地址</th>
                                        <th>目的地址</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="firewallTableBody">
                                    <tr>
                                        <td colspan="9" class="empty-state">加载中...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 新增/编辑规则（下方） -->
                <div class="card">
                    <div class="card-header">
                        <h3 id="formTitle">新增防火墙规则</h3>
                    </div>
                    <div class="card-body">
                        <form id="firewallForm" class="firewall-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="fwProtocol">协议类型 <span class="required">*</span></label>
                                    <select id="fwProtocol" class="form-select" required>
                                        <option value="tcp">TCP</option>
                                        <option value="udp">UDP</option>
                                        <option value="icmp">ICMP</option>
                                        <option value="any">ANY (所有协议)</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="fwAction">处理动作 <span class="required">*</span></label>
                                    <select id="fwAction" class="form-select" required>
                                        <option value="ACCEPT">ACCEPT (允许)</option>
                                        <option value="DROP">DROP (丢弃)</option>
                                        <option value="REJECT">REJECT (拒绝)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="fwSrcIp">源 IP 地址</label>
                                    <input type="text" id="fwSrcIp" class="form-input"
                                           placeholder="例: 192.168.1.100 或 any">
                                </div>
                                <div class="form-group">
                                    <label for="fwDstIp">目的 IP 地址</label>
                                    <input type="text" id="fwDstIp" class="form-input"
                                           placeholder="例: 192.168.1.200 或 any">
                                </div>
                                <div class="form-group">
                                    <label for="fwPort">端口号</label>
                                    <input type="text" id="fwPort" class="form-input"
                                           placeholder="例: 80 或 any" value="any">
                                </div>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary" id="btnAddRule">
                                    ➕ 添加规则
                                </button>
                                <button type="button" class="btn btn-secondary" id="btnCancelEdit" style="display:none;">
                                    ✕ 取消编辑
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <span>OpenWrt Network Manager &copy; 2026</span>
        <span class="footer-sep">|</span>
        <span>《计算机网络系统》实验二</span>
    </footer>

    <!-- 标签切换逻辑 -->
    <script>
        (function() {
            const tabs = document.querySelectorAll('.nav-tab');
            const panels = document.querySelectorAll('.panel');

            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const target = this.dataset.tab;

                    // 切换激活标签
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');

                    // 切换面板
                    panels.forEach(p => p.classList.remove('active'));
                    const panel = document.getElementById(target + 'Panel');
                    if (panel) panel.classList.add('active');

                    // 切换到流量面板时重新调整图表
                    if (target === 'traffic') {
                        setTimeout(() => {
                            const chartDom = document.getElementById('flowChart');
                            if (chartDom) {
                                const inst = echarts.getInstanceByDom(chartDom);
                                if (inst) inst.resize();
                            }
                        }, 100);
                    }
                });
            });
        })();
    </script>
    <script src="js/traffic.js"></script>
    <script src="js/firewall.js"></script>
</body>
</html>
